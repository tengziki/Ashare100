name: Update dynamic A-share top 100

on:
  schedule:
    # UTC 03:35 / 07:10 = 北京时间工作日 11:35 / 15:10：11:30 午休、15:00 收盘集合竞价之后留出行情落地时间，
    # 并避开整点（GitHub 整点排队最严重）。节假日由脚本识别为非交易日，不出新快照。
    # GitHub 定时触发可能延迟；页面始终以行情时间为准。
    - cron: "35 3 * * 1-5"
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "手动验收时的数据时段"
        required: true
        default: close
        type: choice
        options:
          - intraday
          - noon
          - close

permissions:
  contents: read

concurrency:
  group: update-live-universe
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build complete market snapshot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          # 定时任务按实际开跑的北京时间定时段，不按是哪条 cron：2026-10-28 的 12:00 任务被 GitHub 推迟到 18:28 才跑，
          # 按 cron 记成了午间，收盘数据被标成「午间暂定」
          if [ -n "$SCHEDULE" ]; then
            hm=$(TZ=Asia/Shanghai date +%H%M)
            if [ "$hm" -ge 1500 ]; then slot=close
            elif [ "$hm" -ge 1130 ] && [ "$hm" -lt 1300 ]; then slot=noon
            else slot=intraday; fi
          else
            slot="${MANUAL_SLOT:-intraday}"
          fi
          for attempt in 1 2 3; do
            if python scripts/build_live_universe.py --slot "$slot"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 120; fi
          done
          exit 1

      # 公告与问答：失败不影响榜单发布（沿用上一版，页面数据状态面板会提示）
      - name: Update announcements and investor Q&A
        continue-on-error: true
        run: python scripts/update_disclosures.py

      - name: Validate site bundle
        run: python scripts/validate_pages_bundle.py

      # 已核实档案违反硬规则时不提交；自动补档的问题只打印 warning
      - name: Validate company profiles
        run: python scripts/validate_profiles.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- ashare100/ashare100/web/live ashare100/ashare100/profiles)" ]; then
            echo "no change"
          else
            git add ashare100/ashare100/web/live ashare100/ashare100/profiles
            git commit -m "data: update dynamic A-share top 100 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # GITHUB_TOKEN 提交不会再次触发 push 工作流；直接发布本次构建结果。
      - name: Upload site from this run
        uses: actions/upload-pages-artifact@v4
        with:
          path: ashare100/ashare100/web

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated site
        id: deployment
        uses: actions/deploy-pages@v4

  # 失败告警：任一步失败时开一个 data-alert issue；已有未关闭的同类 issue 则追加评论，避免刷屏
  alert:
    needs: [fetch, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="数据更新失败：动态百强榜单"
          body="$(date -u +%Y-%m-%dT%H:%M:%SZ) 运行失败，页面保留上一版数据。日志：$RUN_URL"
          gh label create data-alert --color B42318 --description "数据任务失败告警" 2>/dev/null || true
          number=$(gh issue list --label data-alert --state open --search "in:title $title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label data-alert --body "$body"
          fi

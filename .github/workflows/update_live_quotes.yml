name: Update dynamic A-share top 100

on:
  schedule:
    # UTC 03:35 / 07:10 = 北京时间工作日 11:35 / 15:10：11:30 午休、15:00 收盘集合竞价之后留出行情落地时间，
    # 并避开整点（GitHub 整点排队最严重）。节假日由脚本识别为非交易日，不出新快照。
    # GitHub 定时触发可能延迟；页面始终以行情时间为准。
    - cron: "35 3 * * 1-5"
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "手动验收时的数据时段"
        required: true
        default: close
        type: choice
        options:
          - intraday
          - noon
          - close

permissions:
  contents: read

concurrency:
  group: update-live-universe
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 自动复核读巨潮年报摘要 PDF，需要 pdftotext；装不上时自动复核记为未通过，不影响榜单
      - name: Install pdftotext
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: Build complete market snapshot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          # 定时任务按实际开跑的北京时间定时段，不按是哪条 cron：2026-10-28 的 12:00 任务被 GitHub 推迟到 18:28 才跑，
          # 按 cron 记成了午间，收盘数据被标成「午间暂定」
          if [ -n "$SCHEDULE" ]; then
            hm=$(TZ=Asia/Shanghai date +%H%M)
            if [ "$hm" -ge 1500 ]; then slot=close
            elif [ "$hm" -ge 1130 ] && [ "$hm" -lt 1300 ]; then slot=noon
            else slot=intraday; fi
          else
            slot="${MANUAL_SLOT:-intraday}"
          fi
          for attempt in 1 2 3; do
            if python scripts/build_live_universe.py --slot "$slot"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 120; fi
          done
          exit 1

      # 公告问答、机构持股、高管较慢（数分钟），放到下面的 extras 任务，榜单先发布

      - name: Validate site bundle
        run: python scripts/validate_pages_bundle.py

      # 已核实档案违反硬规则时不提交；自动补档的问题只打印 warning
      - name: Validate company profiles
        run: python scripts/validate_profiles.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 新进公司的 logo 也在本任务里抓取（web/logos 与 logos.js），一并提交，否则下次运行就丢了
          paths="ashare100/ashare100/web/live ashare100/ashare100/profiles ashare100/ashare100/web/logos ashare100/ashare100/web/logos.js"
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "no change"
          else
            git add $paths
            git commit -m "data: update dynamic A-share top 100 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # GITHUB_TOKEN 提交不会再次触发 push 工作流；直接发布本次构建结果。
      - name: Upload site from this run
        uses: actions/upload-pages-artifact@v4
        with:
          path: ashare100/ashare100/web

  # 慢任务：在榜单发布后运行，完成后再发布一次。失败不影响已上线的榜单（沿用上一版，数据状态面板会提示）
  extras:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 取 fetch 任务刚推送的最新提交，而不是触发时的旧提交
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update announcements and investor Q&A
        continue-on-error: true
        run: python scripts/update_disclosures.py

      # 机构持股：全站同一报告期（中报/年报）；同期已有的公司不重抓，只补新进公司
      - name: Update institutional holdings
        continue-on-error: true
        run: python scripts/build_inst_hold.py

      # 核心高管姓名与年报报酬：每家公司约每天重抓一次（20 小时缓存）
      - name: Update executives
        continue-on-error: true
        run: python scripts/build_executives.py

      - name: Validate site bundle
        run: python scripts/validate_pages_bundle.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          paths="ashare100/ashare100/web/live ashare100/ashare100/profiles"
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "no change"
            exit 0
          fi
          git add $paths
          git commit -m "data: disclosures, holdings and executives $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 与其他数据提交错开：推送被拒时先拉取合并再推
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - name: Upload site with disclosures
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-extras
          path: ashare100/ashare100/web

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated site
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-extras:
    needs: [extras, deploy]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site with disclosures
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-extras

  # 失败告警：任一步失败时开一个 data-alert issue；已有未关闭的同类 issue 则追加评论，避免刷屏
  alert:
    needs: [fetch, deploy, extras, deploy-extras]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="数据更新失败：动态百强榜单"
          body="$(date -u +%Y-%m-%dT%H:%M:%SZ) 运行失败，页面保留上一版数据。日志：$RUN_URL"
          gh label create data-alert --color B42318 --description "数据任务失败告警" 2>/dev/null || true
          number=$(gh issue list --label data-alert --state open --search "in:title $title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label data-alert --body "$body"
          fi

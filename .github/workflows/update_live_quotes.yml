name: Update dynamic A-share top 100

on:
  schedule:
    # UTC 04:00 / 07:00 = 北京时间每天 12:00 / 15:00。
    # GitHub 定时触发可能延迟；页面始终以行情时间为准。
    - cron: "0 4 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "手动验收时的数据时段"
        required: true
        default: intraday
        type: choice
        options:
          - intraday
          - noon
          - close

permissions:
  contents: read

concurrency:
  group: update-live-universe
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build complete market snapshot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          if [ "$SCHEDULE" = "0 4 * * *" ]; then
            slot=noon
          elif [ "$SCHEDULE" = "0 7 * * *" ]; then
            slot=close
          else
            slot="${MANUAL_SLOT:-intraday}"
          fi
          for attempt in 1 2 3; do
            if python scripts/build_live_universe.py --slot "$slot"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 120; fi
          done
          exit 1

      - name: Validate site bundle
        run: python scripts/validate_pages_bundle.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- ashare100/ashare100/web/live)" ]; then
            echo "no change"
          else
            git add ashare100/ashare100/web/live
            git commit -m "data: update dynamic A-share top 100 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # GITHUB_TOKEN 提交不会再次触发 push 工作流；直接发布本次构建结果。
      - name: Upload site from this run
        uses: actions/upload-pages-artifact@v4
        with:
          path: ashare100/ashare100/web

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated site
        id: deployment
        uses: actions/deploy-pages@v4
